appId: io.github.gentledev10.plot
productName: Plot
artifactName: Plot-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - from: out/renderer/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
mac:
  icon: build/icon.icns
  minimumSystemVersion: "13.0"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  target:
    - dmg
    - zip
