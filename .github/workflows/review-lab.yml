name: Review lab (intentional regression exercise)

on:
  workflow_dispatch:
  pull_request:
    branches: [review-lab/baseline-20261103]
    paths:
      - examples/pr-review-lab/**
      - .github/workflows/review-lab.yml

permissions:
  contents: read

jobs:
  checkout-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Exercise checkout contracts (regressions are intentional)
        run: node --test --test-isolation=none examples/pr-review-lab/tests/*.test.mjs
