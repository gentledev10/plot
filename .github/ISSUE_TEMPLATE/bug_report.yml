name: Bug report
description: Report a reproducible problem in Plot.
body:
  - type: input
    id: version
    attributes:
      label: Plot version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Remove private code, tokens and repository details before attaching screenshots or logs.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: For AI problems, include the tool, version and sign-in method. Never include keys or tokens.
